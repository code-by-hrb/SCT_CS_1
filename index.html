
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
</head>
<link rel="stylesheet" href="style.css">
<body>
    <div class="container">
        <h1> Caesar Cipher Utility </h1>
        <div class="form_group">
            
                <label for="Msg">Enter Message</label>
                <textarea id="inputtext" placeholder="Type Secret Text Here..."  required>Pbhentr vf sbhaq va hayvxryl cynprf. </textarea>
        </div>
        <div class="row">
         <div class="form_group">
            <label for="shiftkey">Shift Key (1-25)</label>
            <input type="number" min="1" max="25" id="shiftkey" value="13" required>
        </div>
        
            <div class="form_group">
                <label for="Action-mode">Action Mode</label>
                <select id="Action-mode"><option value="decrypt">Decrypt (Decode)</option>
                    <option value="encrypt">Encrypt (Encode)</option>
                 </select></div>
        </div>
           <button onclick="processText()">Run Code Transformation</button>

        <div class="result-box">
            <div class="result-title">Output Result:</div>
            <div id="outputResult" class="result-text">Your decrypted or encrypted message will appear here...</div>
        </div>
    </div>
            <script>
            function caesar(text, shift, encrypt=true){
                if (!Number.isInteger(shift)){
                    return 'Shift Must Be An Integer!';
                    }
                if (shift<1 || shift>25){
                    return 'Shift Must Be An Integer Between 1-25!';
                }
                const alpha='abcdefghijklmnopqrstuvwxyz';
                const alphaUpper=alpha.toUpperCase();
                if (!encrypt){
                    shift=(26-shift)%26;
                }
                const shifted_alpha=alpha.slice(shift)+alpha.slice(0, shift);
                const shifted_alphaUpper=alphaUpper.slice(shift)+alphaUpper.slice(0, shift);
                return text.split('').map(char =>{
                    if (alpha.includes(char)){
                        let index=alpha.indexOf(char);
                        return shifted_alpha[index];
                    }
                    else if (alphaUpper.includes(char)){
                        let index=alphaUpper.indexOf(char);
                        return shifted_alphaUpper[index];
                    }
                    return char;
                }).join('');
                }
                function processText() {
                    const InputText=document.getElementById('inputtext').value;
                    const OutputResult=document.getElementById('outputResult');
                    const ShiftInput=parseInt(document.getElementById('shiftkey').value);
                    const ModeInput=document.getElementById('Action-mode').value;
                    const isEncryptMode=(ModeInput==="encrypt");
                    const FinalResult= caesar(InputText, ShiftInput, isEncryptMode);
                    OutputResult.innerText = FinalResult;
                } 
         </script>

        

</body>
</html>
